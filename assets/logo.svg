<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#1b1e24"/>
  <!-- subtle grain dots -->
  <g fill="#e8e2d4" opacity="0.06">
    <circle cx="18" cy="22" r="1"/><circle cx="64" cy="14" r="1"/><circle cx="112" cy="28" r="1"/>
    <circle cx="156" cy="18" r="1"/><circle cx="204" cy="24" r="1"/><circle cx="238" cy="16" r="1"/>
    <circle cx="28" cy="78" r="1"/><circle cx="82" cy="92" r="1"/><circle cx="142" cy="74" r="1"/>
    <circle cx="198" cy="88" r="1"/><circle cx="232" cy="70" r="1"/><circle cx="16" cy="142" r="1"/>
    <circle cx="74" cy="158" r="1"/><circle cx="128" cy="146" r="1"/><circle cx="186" cy="152" r="1"/>
    <circle cx="240" cy="138" r="1"/><circle cx="32" cy="208" r="1"/><circle cx="96" cy="224" r="1"/>
    <circle cx="160" cy="214" r="1"/><circle cx="222" cy="228" r="1"/><circle cx="46" cy="238" r="1"/>
    <circle cx="118" cy="240" r="1"/><circle cx="192" cy="242" r="1"/>
  </g>

  <!-- Badge outer frame: off-center square with cut corner -->
  <g stroke="#e8e2d4" stroke-width="3" fill="none" stroke-linejoin="miter">
    <path d="M 36 52 L 196 40 L 216 196 L 60 216 Z"/>
  </g>

  <!-- Horizon line inside badge -->
  <line x1="56" y1="150" x2="200" y2="146" stroke="#c96a3a" stroke-width="3" stroke-linecap="square"/>

  <!-- Rising sun arc over horizon -->
  <path d="M 74 146 A 52 52 0 0 1 182 144" fill="none" stroke="#f2b95c" stroke-width="3" stroke-linecap="round"/>

  <!-- Sun rays (short industrial ticks) -->
  <g stroke="#f2b95c" stroke-width="3" stroke-linecap="square">
    <line x1="128" y1="72" x2="128" y2="84"/>
    <line x1="94" y1="82" x2="102" y2="91"/>
    <line x1="162" y1="82" x2="154" y2="91"/>
    <line x1="80" y1="106" x2="92" y2="110"/>
    <line x1="176" y1="106" x2="164" y2="110"/>
  </g>

  <!-- Stopwatch body fused at center of sun arc -->
  <g fill="none" stroke="#e8e2d4" stroke-width="3" stroke-linejoin="miter">
    <circle cx="128" cy="120" r="30"/>
    <!-- stopwatch stem/crown drawn as a small sunrise crown -->
    <path d="M 120 90 L 120 82 L 128 74 L 136 82 L 136 90"/>
    <!-- side buttons -->
    <line x1="98" y1="100" x2="92" y2="96"/>
    <line x1="158" y1="100" x2="164" y2="96"/>
  </g>

  <!-- Stopwatch hand pointing slightly upward-right toward dawn -->
  <line x1="128" y1="120" x2="146" y2="104" stroke="#c96a3a" stroke-width="3" stroke-linecap="square"/>
  <circle cx="128" cy="120" r="3.5" fill="#c96a3a"/>

  <!-- Stopwatch inner tick marks -->
  <g stroke="#e8e2d4" stroke-width="2" stroke-linecap="square">
    <line x1="128" y1="96" x2="128" y2="102"/>
    <line x1="128" y1="138" x2="128" y2="144"/>
    <line x1="104" y1="120" x2="110" y2="120"/>
    <line x1="146" y1="120" x2="152" y2="120"/>
  </g>

  <!-- Small horizon shadow beneath stopwatch -->
  <line x1="84" y1="166" x2="172" y2="163" stroke="#c96a3a" stroke-width="2" stroke-linecap="square"/>

  <!-- Tiny wordmark -->
  <text x="128" y="196" text-anchor="middle" font-family="monospace" font-size="8" letter-spacing="2" fill="#e8e2d4" opacity="0.7">FIRST LIGHT</text>
</svg>
